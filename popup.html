<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>I-collection</title>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FAFAF9;
    --chip: #F2F3F1;
    --line: #E3E5E1;
    --line-strong: #D5D8D3;
    --ink: #1B1E1C;
    --ink-2: #3A3F3C;
    --muted: #5C625E;
    --accent: #2156D9;
    --accent-ink: #1843A8;
    --accent-soft: #E7EEFC;
    --memo-bg: #EEF3FD;
    --danger: #B3261E;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 380px;
    height: 560px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 12px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .version { font-size: 11px; font-weight: 500; color: var(--muted); }
  .count {
    font-size: 12px; font-weight: 500; color: var(--muted);
    background: var(--chip); padding: 4px 10px; border-radius: 999px;
  }

  .search { padding: 12px 18px 8px; }
  .search-box {
    display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface);
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box input {
    flex: 1; border: 0; outline: none; background: transparent;
    font: inherit; font-size: 13px; color: var(--ink);
  }

  #list {
    flex: 1; overflow-y: auto; padding: 4px 18px 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 6px 14px; background: var(--bg); }
  .text {
    margin: 0 0 8px; font-family: var(--serif); font-size: 14px; line-height: 1.65;
    color: var(--ink); white-space: pre-wrap; word-break: break-word;
  }
  .memo-view {
    width: 100%; display: flex; gap: 8px; align-items: flex-start; margin: 0 0 6px;
    padding: 8px 10px; border: 0; border-radius: 8px; background: var(--memo-bg);
    font-size: 12px; line-height: 1.6; color: var(--ink-2); text-align: left;
  }
  .memo-view svg { flex-shrink: 0; margin-top: 4px; }
  .memo-view span { white-space: pre-wrap; word-break: break-word; }
  .memo-edit { margin: 0 0 6px; display: flex; flex-direction: column; gap: 6px; }
  .memo-edit label { font-size: 11px; font-weight: 500; color: var(--ink-2); }
  .memo-edit textarea {
    width: 100%; resize: none; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px;
    font: inherit; font-size: 13px; line-height: 1.6; color: var(--ink); background: var(--bg); outline: none;
  }
  .memo-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .memo-count { font-size: 11px; color: var(--muted); }
  .btn-row { display: flex; gap: 6px; }
  .btn {
    height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--bg); color: var(--ink-2); font-size: 12px; white-space: nowrap;
  }
  .btn.primary { border: 0; background: var(--accent); color: #FFFFFF; font-weight: 500; }
  .btn.danger { color: var(--danger); font-weight: 500; height: 36px; }
  .btn.danger-fill { border: 0; background: var(--danger); color: #FFFFFF; font-weight: 500; height: 36px; }
  .btn.plain { height: 36px; }

  .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .src { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .src a, .src .no-link {
    max-width: 160px; font-size: 12px; font-weight: 500; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .src a:hover { color: var(--accent-ink); }
  .src .no-link { color: var(--muted); text-decoration: none; }
  .date { font-size: 11px; color: var(--muted); }
  .actions { display: flex; gap: 2px; flex-shrink: 0; }
  .icon-btn {
    height: 44px; min-width: 44px; padding: 0 8px; border: 0; background: transparent; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px;
  }
  .icon-btn:hover { background: var(--chip); color: var(--ink); }
  .icon-btn.copied { color: var(--accent); font-weight: 500; }
  .icon-btn:focus-visible, .btn:focus-visible, .memo-view:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .no-results { margin: 32px 0; text-align: center; font-size: 13px; color: var(--muted); }

  #empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 0 32px; text-align: center;
  }
  .empty-icon {
    width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
  }
  #empty h2 { margin: 0; font-size: 15px; font-weight: 700; }
  #empty p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); }
  #empty strong { color: var(--ink); font-weight: 500; }

  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    min-height: 56px; padding: 8px 18px; border-top: 1px solid var(--line); background: var(--surface);
  }
  .hint { margin: 0; font-size: 11px; line-height: 1.5; color: var(--muted); }
  .confirm-text { margin: 0; font-size: 12px; font-weight: 500; color: var(--ink); }

  .credit {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 32px; padding: 0 18px; border-top: 1px solid var(--line); background: var(--bg);
    font-size: 11px; color: var(--muted);
  }
  .credit strong { font-weight: 500; color: var(--ink-2); }
  .credit a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .credit a:hover { color: var(--accent-ink); }

  body { position: relative; }
  .toast {
    position: absolute; left: 50%; bottom: 100px; transform: translate(-50%, 8px);
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px 11px 13px; border-radius: 10px;
    background: #1B1E1C; color: #FFFFFF; font-size: 13px; font-weight: 500;
    box-shadow: 0 10px 28px rgba(20, 24, 22, 0.25); white-space: nowrap;
    opacity: 0; pointer-events: none; z-index: 10;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
      </div>
      <h1>I-collection</h1>
      <span class="version" id="version"></span>
    </div>
    <span class="count" id="count">0개 저장됨</span>
  </header>

  <div class="search" id="search-wrap" hidden>
    <label for="search" class="sr">저장한 문장 검색</label>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5C625E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="문장, 메모, 출처로 검색" autocomplete="off">
    </div>
  </div>

  <main id="list" hidden></main>

  <section id="empty" hidden>
    <div class="empty-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2156D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
    </div>
    <h2>아직 저장한 문장이 없어요</h2>
    <p>웹페이지에서 문장을 드래그하고, 우클릭 메뉴의 <strong>‘I-collection에 저장’</strong>을 눌러 보세요.</p>
  </section>

  <footer id="footer" hidden>
    <div id="footer-normal" style="display: contents">
      <p class="hint">문장을 드래그한 뒤 우클릭 →<br>‘I-collection에 저장’</p>
      <button type="button" class="btn danger" id="clear">전체 삭제</button>
    </div>
    <div id="footer-confirm" style="display: contents" hidden>
      <p class="confirm-text" id="confirm-text">모두 지울까요?</p>
      <div class="btn-row">
        <button type="button" class="btn plain" id="clear-cancel">취소</button>
        <button type="button" class="btn danger-fill" id="clear-ok">모두 삭제</button>
      </div>
    </div>
  </footer>

  <div class="credit">
    <span>Made by <strong id="author"></strong></span>
    <span id="contact"></span>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FB4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
    <span id="toast-text"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
